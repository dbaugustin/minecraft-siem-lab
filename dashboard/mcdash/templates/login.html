{% extends "base.html" %}
{% block title %}Log in · Minecraft Dashboard{% endblock %}
{% block content %}
<div class="card auth">
  <div class="brand"><span class="brand-mark"></span>Minecraft Dashboard</div>
  <form method="post" novalidate>
    {{ form.hidden_tag() }}
    <label>{{ form.username.label.text }} {{ form.username(autocomplete="username", autofocus=true) }}</label>
    <label>{{ form.password.label.text }} {{ form.password(autocomplete="current-password") }}</label>
    <button type="submit" class="primary">Log in</button>
  </form>
</div>
{% endblock %}
