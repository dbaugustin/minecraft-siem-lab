<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Minecraft Dashboard{% endblock %}</title>
</head>
<body>
  <header>
    <strong>Minecraft Dashboard</strong>
    {% if session.user %}
      <form method="post" action="{{ url_for('auth.logout') }}" style="display:inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <span>Signed in as {{ session.user }}</span>
        <button type="submit">Log out</button>
      </form>
    {% endif %}
  </header>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <p class="flash {{ category }}" role="alert">{{ message }}</p>
    {% endfor %}
  {% endwith %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
