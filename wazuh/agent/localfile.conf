<!--
  Paste these blocks inside <ossec_config> in the Wazuh AGENT's config on the
  server box (/var/ossec/etc/ossec.conf), then restart the agent:
      sudo systemctl restart wazuh-agent

  The paths assume the repo is checked out at /opt/minecraft-siem-lab.
  Change that prefix to wherever docker-compose.yml lives on the box.
-->

<!-- Dashboard audit log (./logs/audit.jsonl): one JSON object per line. -->
<localfile>
  <log_format>json</log_format>
  <location>/opt/minecraft-siem-lab/logs/audit.jsonl</location>
</localfile>

<!--
  Minecraft server logs, one per world (worlds/<world>/data is that world's
  /data). The wildcard picks up worlds created later from the dashboard; the
  agent rescans for new matches every minute. Each server renames latest.log
  to a dated .log.gz on start, and the agent follows the new file.
-->
<localfile>
  <log_format>syslog</log_format>
  <location>/opt/minecraft-siem-lab/worlds/*/data/logs/latest.log</location>
</localfile>
