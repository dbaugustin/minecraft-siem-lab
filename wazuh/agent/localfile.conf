<!--
  Paste these blocks inside <ossec_config> in the Wazuh AGENT's config on the
  server box (/var/ossec/etc/ossec.conf), then restart the agent:
      sudo systemctl restart wazuh-agent

  Adjust both paths to where the repo and the Minecraft data volume live on
  the host. The examples assume the repo is checked out at
  /opt/minecraft-siem-lab and the itzg/minecraft-server /data volume is
  bind-mounted at ./minecraft-data.
-->

<!-- Dashboard audit log: one JSON object per line. -->
<localfile>
  <log_format>json</log_format>
  <location>/opt/minecraft-siem-lab/dashboard/logs/audit.log</location>
</localfile>

<!--
  Minecraft server log. The server renames latest.log to a dated .log.gz on
  every start; the agent notices the file was replaced and follows the new one.
-->
<localfile>
  <log_format>syslog</log_format>
  <location>/opt/minecraft-siem-lab/minecraft-data/logs/latest.log</location>
</localfile>
